<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=auto"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="PRA web UI — chat with your personal research assistant."
      data-i18n-meta="description"
    />
    <meta
      name="theme-color"
      content="#fffbfe"
      data-theme-color-light="#fffbfe"
      data-theme-color-dark="#141218"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PRA" />
    <!-- The .ico is declared first and deliberately: Safari does not render
         SVG favicons and falls back to requesting /favicon.ico on its own
         account, so leaving that to chance meant the browser asked for a file
         the server answered with the SPA shell -- HTML, as an image. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/brand/pra_mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/pra_favicon_32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/pra_apple_touch.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      /* App-like feel on touch devices: no double-tap zoom on interactive
         elements (system-level accessibility zoom still works), and no text
         size inflation on orientation change. */
      html {
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }

      /* These four colours are the MD3 background/on-background pair, written
         as literals on purpose: this sheet paints the first frame, before
         globals.css has downloaded, so it cannot read --background. Keep it in
         step with the :root and .dark blocks there or the first paint flashes
         the previous theme's colours. */
      body {
        margin: 0;
        background: #fffbfe;
        color: #1c1b1f;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }

      html.dark body {
        background: #141218;
        color: #e6e0e9;
      }

      .boot-splash {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
      }

      .boot-splash-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(230, 224, 233, 0.74);
        font-size: 14px;
      }

      html:not(.dark) .boot-splash-inner {
        color: rgba(28, 27, 31, 0.64);
      }

      .boot-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: currentColor;
        opacity: 0.75;
        animation: boot-pulse 1s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.45;
        }
        50% {
          transform: scale(1);
          opacity: 0.85;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = null;
          try {
            stored = localStorage.getItem("nanobot-webui.theme");
          } catch {}
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            var color = themeColor.getAttribute(
              dark ? "data-theme-color-dark" : "data-theme-color-light"
            );
            if (color) themeColor.setAttribute("content", color);
          }
        } catch {}
      })();
    </script>
    <title>PRA</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash-inner">
          <span class="boot-dot" aria-hidden="true"></span>
          <span data-boot-copy>Loading PRA…</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var localeKey = "nanobot.locale";
        var copy = {
          en: {
            boot: "Loading PRA…",
            description: "PRA web UI — chat with your personal research assistant."
          },
          "zh-CN": {
            boot: "正在加载 PRA…",
            description: "PRA Web UI —— 与你的个人研究助理对话。"
          },
          "zh-TW": {
            boot: "正在載入 PRA…",
            description: "PRA Web UI —— 與你的個人研究助理對話。"
          },
          fr: {
            boot: "Chargement de PRA…",
            description: "Interface web PRA — discutez avec votre assistant de recherche personnel."
          },
          ja: {
            boot: "PRA を読み込み中…",
            description: "PRA Web UI — パーソナルリサーチアシスタントと会話します。"
          },
          ko: {
            boot: "PRA 불러오는 중…",
            description: "PRA 웹 UI — 개인 연구 어시스턴트와 대화하세요."
          },
          es: {
            boot: "Cargando PRA…",
            description: "Interfaz web de PRA: conversa con tu asistente personal de investigación."
          },
          "pt-BR": {
            boot: "Carregando PRA…",
            description: "Interface web do PRA — converse com o seu assistente pessoal de pesquisa."
          },
          vi: {
            boot: "Đang tải PRA…",
            description: "Giao diện web PRA — trò chuyện với trợ lý nghiên cứu cá nhân của bạn."
          },
          id: {
            boot: "Memuat PRA…",
            description: "UI web PRA — ngobrol dengan asisten riset pribadi Anda."
          }
        };

        function normalizeLocale(input) {
          if (!input) return "en";
          var raw = String(input).trim();
          if (!raw) return "en";
          if (copy[raw]) return raw;
          var lower = raw.toLowerCase();
          if (lower === "zh" || lower.indexOf("zh-cn") === 0 || lower.indexOf("zh-sg") === 0) {
            return "zh-CN";
          }
          if (
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-TW";
          }
          if (lower === "pt" || lower.indexOf("pt-") === 0) {
            return "pt-BR";
          }
          var base = lower.split("-")[0];
          return copy[base] ? base : "en";
        }

        try {
          var stored = localStorage.getItem(localeKey);
          var detected =
            stored ||
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var locale = normalizeLocale(detected);
          var localized = copy[locale] || copy.en;
          document.documentElement.lang = locale;
          var description = document.querySelector('[data-i18n-meta=\"description\"]');
          if (description) description.setAttribute("content", localized.description);
          var boot = document.querySelector("[data-boot-copy]");
          if (boot) boot.textContent = localized.boot;
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
